
name: Cricket Win Prediction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          pip install pytest pytest-cov ruff httpx pip-audit pyarrow

      - name: Ruff lint
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Dependency security audit
        run: pip-audit -r requirements-api.txt

      - name: Run tests with coverage
        run: |
          pytest -q --cov=cricketwp --cov-report=term --cov-fail-under=50

      - name: Build Docker image
        run: docker build -t cwp-api:ci .
