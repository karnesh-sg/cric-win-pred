
name: Cricket Win Prediction CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-api.txt
          pip install -e .
          pip install pytest ruff httpx

    - name: Lint API files
      run: ruff check src/cricketwp/api/main.py src/cricketwp/predictor.py

      - name: Run tests
        run: pytest -q
