
name: Deployed API Smoke Test

on:
  schedule:
    - cron: "30 1 * * *"

  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run deployed API smoke test
        run: python scripts/smoke_test.py "$API_BASE"
        env:
          API_BASE: ${{ vars.API_BASE }}
